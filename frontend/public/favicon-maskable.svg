      <line x1="256" y1="180" x2="316" y2="250"/>
      <line x1="196" y1="250" x2="256" y2="330"/>
      <line x1="316" y1="250" x2="256" y2="330"/>
      <line x1="196" y1="250" x2="316" y2="250"/>
    </g>
    <circle cx="256" cy="180" r="20" fill="#20D9F2"/>
    <circle cx="196" cy="250" r="16" fill="#338BFF"/>
    <circle cx="316" cy="250" r="16" fill="#338BFF"/>
